<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 · 晴天小站</title>
  <link rel="icon" href="sun-avatar-sm.png" type="image/png">
  <style>
    /* 字体文件（本地） */
    @font-face {
      font-family: 'LXGW WenKai';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/LXGWWenKai-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'LXGW WenKai';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('fonts/LXGWWenKai-Medium.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Playfair Display';
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url('fonts/PlayfairDisplay.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('fonts/CormorantGaramond.ttf') format('truetype');
    }
    :root {
      /* 暖纸·晴天 */
      --accent: #5d7a4e;
      --accent-ink: #46643a;
      --bg: #f2eee4;
      --card: #fffdf7;
      --line: rgba(58, 50, 42, .13);
      --line-strong: rgba(58, 50, 42, .34);
      --text: #35302a;
      --muted: rgba(53, 48, 42, .6);
      --shadow: rgba(58, 50, 42, .08);
      color-scheme: light;

      /* 字体分层（参考 ahzoo） */
      --font-body: "LXGW WenKai", -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --font-display: "Playfair Display", "LXGW WenKai", "Noto Serif SC", "Songti SC", SimSun, serif;
      --font-hand: "LXGW WenKai", "KaiTi", "STKaiti", "楷体", serif;
      --font-num: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* 顶部导航（全站统一） */
    nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    nav .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-family: var(--font-hand); font-size: 1.12rem; font-weight: 800; letter-spacing: .02em; }
    nav .logo span { color: var(--accent-ink); }
    nav .right { display: flex; align-items: center; gap: 12px; }
    nav .menu { display: flex; gap: 2px; }
    nav .menu a {
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .93rem;
      transition: color .2s, background .2s;
    }
    nav .menu a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    nav .menu a.active {
      color: #fff;
      font-weight: 600;
      background: var(--accent-ink);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-ink) 30%, transparent);
    }

    /* 主体 */
    .container { max-width: 680px; margin: 0 auto; padding: 48px 24px 60px; }

    /* 页头：面包屑 + 标题 */
    .page-head { margin-bottom: 30px; }
    .crumbs {
      font-family: var(--font-display);
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .crumbs a { color: var(--muted); transition: color .2s; }
    .crumbs a:hover { color: var(--accent-ink); }
    .crumbs .sep { margin: 0 8px; color: var(--line-strong); }
    .crumbs .cur { color: var(--text); font-weight: 600; }
    .page-head h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4.5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -.01em;
    }
    .page-head p { color: var(--muted); font-size: .9rem; margin-top: 6px; }

    /* 关于我卡片 */
    .about-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 34px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .about-card .ava {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--line-strong);
      animation: ava-glow 3.2s ease-in-out infinite;
    }
    .about-card .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes ava-glow {
      0%, 100% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 12px color-mix(in srgb, var(--accent) 20%, transparent);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
        transform: translateY(-3px);
      }
    }
    .about-card .lead {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-ink);
      margin-bottom: 18px;
      text-align: center;
    }
    .about-card p {
      color: var(--text);
      margin-bottom: 14px;
    }
    .about-card p:last-child { margin-bottom: 0; }
    .about-card .muted { color: var(--muted); }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    footer {
      text-align: center;
      padding: 40px 24px 48px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    footer .brand { color: var(--accent-ink); }

    @media (max-width: 640px) {
      nav .menu a { padding: 7px 8px; font-size: .88rem; }
      .container { padding: 32px 18px 50px; }
      .about-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav>
    <div class="inner">
      <a class="logo" href="index.html"><span>晴天</span>小站</a>
      <div class="right">
        <div class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html">博客</a>
          <a href="bookmarks.html">书签</a>
          <a href="about.html" class="active">关于我</a>
          <a href="contact.html">联系我</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 页头：面包屑 + 标题 -->
    <header class="page-head reveal">
      <nav class="crumbs" aria-label="面包屑">
        <a href="index.html">首页</a><span class="sep">/</span>
        <span class="cur">关于我</span>
      </nav>
      <h1>关于我</h1>
      <p>About / 晴天好心情 desuwa</p>
    </header>

    <!-- 关于我内容 -->
    <div class="about-card reveal">
      <div class="ava"><img src="sun-avatar.png" alt=""></div>
      <p class="lead">晴天好心情 desuwa</p>
      <p>最尊重token、最礼貌ai、it最精通ai最趁手之人(以上均属实=ω=）</p>
      <p class="muted">不想起床懒得睡觉 · 早餐吃什么呢 / 午餐吃什么呢 / 晚餐吃什么呢 · 今天听点啥歌呢</p>
      <p class="muted">此站由本人扎实雄厚的IT编程基础(doge，以及一点Vibe Coding支持完成</p>
    </div>
  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    // 滚动显示动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
</body>
</html>
