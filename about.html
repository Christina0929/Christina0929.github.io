<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem("site-theme")||((document.cookie.match(/(?:^|; )site-theme=([^;]*)/))||[])[1]||"";if(t)document.documentElement.setAttribute("data-theme",decodeURIComponent(t))}catch(e){}</script>
  <title>关于我 · 晴天小站</title>
  <link rel="icon" href="sun-avatar-sm.png" type="image/png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/music-player.css?v=2">
  <style data-page-css>

    /* 主体 */
    .container { max-width: 680px; margin: 0 auto; padding: 48px 24px 60px; }

    .about-card { padding: 34px; }
    .about-card .ava {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--line-strong);
      animation: ava-glow 3.2s ease-in-out infinite;
    }
    .about-card .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes ava-glow {
      0%, 100% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 12px color-mix(in srgb, var(--accent) 20%, transparent);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
        transform: translateY(-3px);
      }
    }
    .about-card .lead {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-ink);
      margin-bottom: 18px;
      text-align: center;
    }
    .about-card p {
      color: var(--text);
      margin-bottom: 14px;
    }
    .about-card p:last-child { margin-bottom: 0; }
    .about-card .muted { color: var(--muted); }


    @media (max-width: 640px) {
      .container { padding: 32px 18px 50px; }
      .about-card { padding: 24px; }
    }

  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav>
    <div class="inner">
      <a class="logo" href="index.html"><span>晴天</span>小站</a>
      <div class="right">
        <div class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html">博客</a>
          <a href="bookmarks.html">书签</a>
          <a href="collection.html" class="coll-a">收藏</a>
          <a href="about.html" class="active">关于我</a>
          <a href="contact.html">联系我</a>
          <button class="cl-toggle" id="cl-toggle">日志</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 页头：面包屑 + 标题 -->
    <header class="page-head reveal">
      <nav class="crumbs" aria-label="面包屑">
        <a href="index.html">首页</a><span class="sep">/</span>
        <span class="cur">关于我</span>
      </nav>
      <h1 data-en="About Me">关于我</h1>
      <p>About / 晴天好心情 desuwa</p>
    </header>

    <!-- 关于我内容 -->
    <div class="about-card reveal">
      <div class="ava"><img src="sun-avatar.png" alt=""></div>
      <p class="lead">晴天好心情 desuwa</p>
      <p>最尊重token、最礼貌ai、it最精通ai最趁手之人(以上均属实=ω=）</p>
      <p class="muted">不想起床懒得睡觉 · 早餐吃什么呢 / 午餐吃什么呢 / 晚餐吃什么呢 · 今天听点啥歌呢</p>
      <p class="muted">此站由本人扎实雄厚的IT编程基础(doge，以及一点Vibe Coding支持完成</p>
    </div>
  </div>

  <div class="cl-panel" id="cl-panel">
    <h3>站点日志</h3>
    <div id="cl-timeline"></div>
  </div>

  <div class="music-card collapsed" id="music-card">
    <div class="mc-disc" id="mc-disc">
      <div class="mc-ring"></div>
      <div class="mc-center"><img src="sun-avatar-sm.png" alt=""></div>
    </div>
    <div class="mc-info">
      <div class="mc-name" id="mc-name">--</div>
      <div class="mc-artist" id="mc-artist">--</div>
    </div>
    <div class="mc-controls">
      <button class="mc-btn" id="mc-prev">&#9198;</button>
      <button class="mc-btn play" id="mc-play">&#9654;</button>
      <button class="mc-btn" id="mc-next">&#9197;</button>
      <button class="mc-btn mc-shuffle" id="mc-shuffle" title="随机换一首">&#8635;</button>
    </div>
    <div class="mc-progress" id="mc-progress"><div class="bar" id="mc-bar"></div></div>
    <div class="mc-time"><span id="mc-current">0:00</span><span id="mc-total">0:00</span></div>
    <div class="mc-volume">
      <span class="mc-vol-icon" id="mc-vol-icon">&#128266;</span>
      <input type="range" class="mc-vol-slider" id="mc-vol" min="0" max="100" value="80">
    </div>
  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    // 滚动显示动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
  <script src="js/music-player.js?v=2"></script>
  <script src="js/changelog.js"></script>
  <script src="js/scrollfx.js" defer></script>
  <script src="js/theme-switcher.js" defer></script>
  <script src="js/pjax.js"></script></body>
</html>
