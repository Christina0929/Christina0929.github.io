<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem("site-theme")||((document.cookie.match(/(?:^|; )site-theme=([^;]*)/))||[])[1]||"";if(t)document.documentElement.setAttribute("data-theme",decodeURIComponent(t))}catch(e){}</script>
  <title>博客 · 晴天小站</title>
  <link rel="icon" href="sun-avatar-sm.png" type="image/png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/music-player.css?v=2">
  <style data-page-css>
    /* ===== 博客页专属：编辑式文章索引（step3） ===== */
    .articles { border-top: 1px solid var(--line); }
    .article {
      display: grid;
      grid-template-columns: 3.6rem minmax(0, 1fr) auto auto;
      align-items: baseline;
      gap: 1.3rem;
      padding: 1.05rem .5rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .3s, padding .3s;
    }
    .article:hover {
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      padding-left: 1.1rem;
    }
    .article .no {
      font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
      font-size: .7rem;
      letter-spacing: .12em;
      color: var(--accent);
    }
    .article .tag {
      display: inline-block;
      font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
      font-size: .58rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent-ink);
      margin-bottom: 4px;
    }
    .article .a-main { min-width: 0; }
    .article .a-main h3 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 2.4vw, 1.65rem);
      font-weight: 800;
      letter-spacing: .01em;
      line-height: 1.25;
      margin-bottom: 2px;
      transition: color .3s, transform .45s cubic-bezier(.16,1,.3,1);
    }
    .article:hover .a-main h3 { color: var(--accent-ink); transform: translateX(6px); }
    .article .a-sum {
      font-size: .84rem;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .article .date { font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace); font-size: .66rem; color: var(--muted); white-space: nowrap; letter-spacing: .1em; }
    .article .go {
      font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
      font-size: .85rem;
      color: var(--muted);
      transition: color .3s, transform .35s;
    }
    .article:hover .go { color: var(--accent-ink); transform: translate(3px, -3px); }

    .article.reveal { opacity: 0; transform: translateY(22px); }
    .article.reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 640px) {
      .article { grid-template-columns: minmax(0, 1fr) auto; padding: .9rem .3rem; }
      .article .no { display: none; }
      .article .date { display: none; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav>
    <div class="inner">
      <a class="logo" href="index.html"><span>晴天</span>小站</a>
      <div class="right">
        <div class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html" class="active">博客</a>
          <a href="bookmarks.html">书签</a>
          <a href="collection.html" class="coll-a">收藏</a>
          <a href="about.html">关于我</a>
          <a href="contact.html">联系我</a>
          <button class="cl-toggle" id="cl-toggle">日志</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 页头横幅 -->
    <header class="page-head reveal">
      <nav class="crumbs" aria-label="面包屑">
        <a href="index.html">首页</a><span class="sep">/</span>
        <span class="cur">博客</span>
      </nav>
      <h1>博客<span class="en">Blog Posts</span></h1>
      <p class="sub">记录代码、生活与杂七杂八。</p>
    </header>

    <!-- 博客文章列表 -->
    <div class="articles" id="articles"></div>
  </div>

  <div class="cl-panel" id="cl-panel">
    <h3>站点日志</h3>
    <div id="cl-timeline"></div>
  </div>

  <div class="music-card collapsed" id="music-card">
    <div class="mc-disc" id="mc-disc">
      <div class="mc-ring"></div>
      <div class="mc-center"><img src="sun-avatar-sm.png" alt=""></div>
    </div>
    <div class="mc-info">
      <div class="mc-name" id="mc-name">--</div>
      <div class="mc-artist" id="mc-artist">--</div>
    </div>
    <div class="mc-controls">
      <button class="mc-btn" id="mc-prev">&#9198;</button>
      <button class="mc-btn play" id="mc-play">&#9654;</button>
      <button class="mc-btn" id="mc-next">&#9197;</button>
      <button class="mc-btn mc-shuffle" id="mc-shuffle" title="随机换一首">&#8635;</button>
    </div>
    <div class="mc-progress" id="mc-progress"><div class="bar" id="mc-bar"></div></div>
    <div class="mc-time"><span id="mc-current">0:00</span><span id="mc-total">0:00</span></div>
    <div class="mc-volume">
      <span class="mc-vol-icon" id="mc-vol-icon">&#128266;</span>
      <input type="range" class="mc-vol-slider" id="mc-vol" min="0" max="100" value="80">
    </div>
  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    // 滚动显示动画（交错入场）
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          e.target.style.transitionDelay = Math.min(i * 100, 400) + 'ms';
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: .1 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 博客文章列表
    // 注意：『正在开发』(post3.html) 永远置底，新文章一律插到它前面（即在它上方加一行）
    const posts = [
      { tag: '新文章', date: '2026-08-05', title: "开站大吉 '◡'", href: 'post1.html', sum: '重生之我是HTML高手。' },
      { tag: '最新留言', date: '2026-08-05', title: '正在开发', href: 'post3.html', sum: '仍在test中，敬请期待…' }
    ];
    const articleBox = document.getElementById('articles');
    articleBox.innerHTML = posts.map((p, i) => `
      <article class="article reveal" data-i="${i}" style="transition-delay:${i * 100}ms">
        <span class="no">${String(i + 1).padStart(3, '0')}</span>
        <div class="a-main">
          <span class="tag">${p.tag}</span>
          <h3>${p.title}</h3>
          <p class="a-sum">${p.sum}</p>
        </div>
        <span class="date">${p.date}</span>
        <span class="go" aria-hidden="true">→</span>
      </article>
    `).join('');
    articleBox.querySelectorAll('.article').forEach((el) => observer.observe(el));
    articleBox.addEventListener('click', (e) => {
      const card = e.target.closest('.article');
      if (!card) return;
      const href = posts[card.dataset.i].href;
      // 有软导航则走 __pjax（不刷新整页，音乐卡片/audio 保留），否则整页跳转兜底
      if (window.__pjax) window.__pjax.go(href);
      else window.location.href = href;
    });
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
  <script src="js/music-player.js?v=2"></script>
  <script src="js/changelog.js"></script>
  <script src="js/scrollfx.js" defer></script>
  <script src="js/theme-switcher.js" defer></script>
  <script src="js/pjax.js"></script></body>
</html>
