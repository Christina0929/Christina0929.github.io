<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="sun-avatar-sm.png">
  <title>博客 · 晴天小站</title>
  <style>
    :root {
      /* 暖纸·晴天 */
      --accent: #5d7a4e;
      --accent-ink: #46643a;
      --bg: #f2eee4;
      --card: #fffdf7;
      --line: rgba(58, 50, 42, .13);
      --line-strong: rgba(58, 50, 42, .34);
      --text: #35302a;
      --muted: rgba(53, 48, 42, .6);
      --shadow: rgba(58, 50, 42, .08);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* 顶部导航（四页统一） */
    nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    nav .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-size: 1.12rem; font-weight: 800; letter-spacing: .02em; }
    nav .logo span { color: var(--accent-ink); }
    nav .right { display: flex; align-items: center; gap: 12px; }
    nav .menu { display: flex; gap: 2px; }
    nav .menu a {
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .93rem;
      transition: color .2s, background .2s;
    }
    nav .menu a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    nav .menu a.active {
      color: #fff;
      font-weight: 600;
      background: var(--accent-ink);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-ink) 30%, transparent);
    }

    /* 主体 */
    .container { max-width: 680px; margin: 0 auto; padding: 48px 24px 60px; }

    /* 页头：标题 + 面包屑 */
    .page-head { margin-bottom: 30px; }
    .crumbs {
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .crumbs a { color: var(--muted); transition: color .2s; }
    .crumbs a:hover { color: var(--accent-ink); }
    .crumbs .sep { margin: 0 8px; color: var(--line-strong); }
    .crumbs .cur { color: var(--text); font-weight: 600; }
    .page-head h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -.01em;
    }
    .page-head p { color: var(--muted); font-size: .9rem; margin-top: 6px; }

    /* 博客列表：innei 式紧凑列表（发丝线分隔、无卡片） */
    .articles { border-top: 1px solid var(--line); }
    .article {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 18px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .15s;
    }
    .article:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    .article .tag {
      font-size: .72rem;
      letter-spacing: .06em;
      color: var(--accent-ink);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 2px 11px;
      white-space: nowrap;
    }
    .article .a-main { min-width: 0; }
    .article .a-main h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 3px; transition: color .15s; }
    .article:hover .a-main h3 { color: var(--accent-ink); }
    .article .a-sum {
      font-size: .84rem;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .article .date { font-size: .78rem; color: var(--muted); white-space: nowrap; }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    footer {
      text-align: center;
      padding: 40px 24px 48px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    footer .brand { color: var(--accent-ink); }

    @media (max-width: 640px) {
      nav .menu a { padding: 7px 8px; font-size: .88rem; }
      .container { padding: 32px 18px 50px; }
      .article { grid-template-columns: 1fr; gap: 6px; padding: 16px 2px; }
      .article .date { justify-self: start; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav>
    <div class="inner">
      <a class="logo" href="index.html"><span>晴天</span>小站</a>
      <div class="right">
        <div class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html" class="active">博客</a>
          <a href="index.html#about">关于我</a>
          <a href="contact.html">联系我</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- 页头：面包屑 + 标题 -->
    <header class="page-head reveal">
      <nav class="crumbs" aria-label="面包屑">
        <a href="index.html">首页</a><span class="sep">/</span>
        <span class="cur">博客</span>
      </nav>
      <h1>博客</h1>
      <p>记录代码、生活与杂七杂八。</p>
    </header>

    <!-- 博客文章列表 -->
    <div class="articles reveal" id="articles"></div>
  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    // 滚动显示动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 博客文章列表
    const posts = [
      { tag: '新文章', date: '2026年8月5日', title: "开站大吉 '◡'", href: 'post1.html', sum: '重生之我是HTML高手。' },
      { tag: '收藏', date: '2026年8月5日', title: '网页便笺', href: 'post2.html', sum: '悄咪咪地查看，声张滴不要。' },
      { tag: '最新留言', date: '2026年8月5日', title: '正在开发', href: 'post3.html', sum: '仍在test中，敬请期待…' }
    ];
    const articleBox = document.getElementById('articles');
    articleBox.innerHTML = posts.map((p, i) => `
      <article class="article" data-i="${i}">
        <span class="tag">${p.tag}</span>
        <div class="a-main">
          <h3>${p.title}</h3>
          <p class="a-sum">${p.sum}</p>
        </div>
        <span class="date">${p.date}</span>
      </article>
    `).join('');
    articleBox.addEventListener('click', (e) => {
      const card = e.target.closest('.article');
      if (!card) return;
      window.location.href = posts[card.dataset.i].href;
    });
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
</body>
</html>
