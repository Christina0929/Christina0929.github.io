    /* 主体（书签页加宽，目录型页面需要密度） */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 50px;
    }

    /* 页头横幅 + 统计 */
    .page-head {
      border-radius: 24px;
      padding: 38px 34px 28px;
      background:
        radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 45%),
        var(--panel-bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .page-head h1 {
      font-size: clamp(1.7rem, 4.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: .02em;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .page-head h1 .en {
      font-family: var(--font-en);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .page-head .sub {
      font-family: var(--font-hand);
      font-size: .95rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-top: 6px;
    }
    .head-stats { display: flex; gap: 10px; }
    .head-stats .chip {
      background: var(--panel-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 18px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .head-stats .chip b {
      display: block;
      font-family: var(--font-en);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
    }
    .head-stats .chip span { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }

    /* 搜索 + 分类过滤卡 */
    .bk-tool {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px 18px;
      margin-bottom: 22px;
      position: sticky;
      top: 78px;
      z-index: 50;
      transition: box-shadow .3s;
    }
    .bk-tool:focus-within { box-shadow: var(--shadow-md); }
    .bk-tool .search {
      width: 100%;
      font-family: var(--font-body);
      font-size: .95rem;
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      border: 1.5px solid transparent;
      border-radius: 999px;
      padding: 11px 20px;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .bk-tool .search::placeholder { color: var(--muted); }
    .bk-tool .search:focus {
      background: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .bk-tool .tool-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
    .bk-filter { display: flex; flex-wrap: wrap; gap: 8px; }
    .bk-filter button {
      font-family: var(--font-body);
      font-size: .84rem;
      font-weight: 500;
      color: var(--muted);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: color .2s, background .2s, box-shadow .2s, transform .2s;
    }
    .bk-filter button:hover { color: var(--text); background: color-mix(in srgb, var(--accent) 11%, transparent); transform: translateY(-1px); }
    .bk-filter button.on {
      color: #fff;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-ink));
      box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .bk-filter .n {
      font-size: .74rem;
      opacity: .75;
      margin-left: 3px;
      font-variant-numeric: tabular-nums;
    }
    .bk-count { font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* 分组：宽屏双栏瀑布流 */
    .bk-groups { columns: 2; column-gap: 18px; }
    .bk-group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 20px 22px 16px;
      margin-bottom: 18px;
      break-inside: avoid;
      transition: box-shadow .3s;
    }
    .bk-group:hover { box-shadow: var(--shadow-md); }
    .bk-group .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      cursor: pointer;
      user-select: none;
    }
    .bk-group .ico {
      width: 38px; height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      border-radius: 12px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), color-mix(in srgb, var(--accent-2) 15%, transparent));
    }
    .bk-group h2 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .04em;
      flex: 1; min-width: 0;
    }
    .bk-group .count {
      font-size: .76rem;
      font-weight: 600;
      color: var(--accent-ink);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 999px;
      padding: 2px 12px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .bk-group .chev {
      flex-shrink: 0;
      color: var(--muted);
      font-size: .8rem;
      transition: transform .3s;
    }
    .bk-group.folded .chev { transform: rotate(-90deg); }

    /* 折叠动画（grid-rows 技巧） */
    .bk-fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s cubic-bezier(.22,.8,.36,1); }
    .bk-fold > div { overflow: hidden; min-height: 0; }
    .bk-group.folded .bk-fold { grid-template-rows: 0fr; }

    /* 书签迷你卡片 */
    .bk-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 4px; }
    .bk-links a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: .87rem;
      font-weight: 500;
      min-width: 0;
      transition: color .2s, background .2s, border-color .2s, transform .2s, box-shadow .2s;
    }
    .bk-links a:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 5%, var(--card));
      border-color: var(--line);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .bk-links .fav { width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; opacity: .9; }
    .bk-links .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bk-links .go {
      flex-shrink: 0;
      font-size: .8rem;
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity .2s, transform .2s, color .2s;
    }
    .bk-links a:hover .go { opacity: .7; transform: translate(0, 0); color: var(--accent-ink); }
    .bk-empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 34px 0 14px; column-span: all; }

    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s cubic-bezier(.22,.8,.36,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    @media (max-width: 920px) {
      .bk-groups { columns: 1; }
    }
    @media (max-width: 640px) {
      main { padding: 24px 14px 40px; }
      .page-head { padding: 28px 20px 22px; border-radius: 18px; }
      .bk-tool { padding: 12px 12px; border-radius: 16px; top: 70px; }
      .tool-row { flex-direction: column; align-items: stretch; }
      .bk-count { order: -1; }
      .bk-links { grid-template-columns: 1fr 1fr; }
      .bk-group { padding: 16px 16px 14px; border-radius: 16px; }
      .bk-group .ico { width: 32px; height: 32px; font-size: .95rem; border-radius: 10px; }
    }
  </style>
</head>

    // 分类胶囊（带数量）
    const folders = [...new Set(ALL_BOOKMARKS.map(b => b.folder))];
    const folderCount = (k) => k ? ALL_BOOKMARKS.filter(b => b.folder === k).length : ALL_BOOKMARKS.length;

        `<button data-f="${m.key}">${m.icon} ${m.key}<span class="n">${folderCount(m.key)}</span></button>`)
    ].join('');
    filterEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFolder = btn.dataset.f || null;
        filterEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
        render();
      });
    });

    const bindReveal = () => {
      const els = document.querySelectorAll('.bk-groups .reveal:not(.visible)');
      const io = new IntersectionObserver((es) => {
        es.forEach((e, i) => {
          if (e.isIntersecting) {
            e.target.style.transitionDelay = Math.min(i * 60, 300) + 'ms';
            e.target.classList.add('visible');
            io.unobserve(e.target);
          }
        });
      }, { threshold: .08 });
      els.forEach((el) => io.observe(el));
    };

      const q = searchEl.value.trim().toLowerCase();
      let visible = ALL_BOOKMARKS;
      if (activeFolder) visible = visible.filter(b => b.folder === activeFolder);
      if (q) visible = visible.filter(b => (b.folder + ' ' + b.name + ' ' + b.url).toLowerCase().includes(q));
      countEl.textContent = '显示 ' + visible.length + ' / ' + ALL_BOOKMARKS.length + ' 个';

      const g = {};
      visible.forEach(b => { const k = b.folder || '未分类'; (g[k] = g[k] || []).push(b); });
      const list = GROUP_META.filter(m => g[m.key]);
      const extra = Object.keys(g).filter(k => !GROUP_META.some(m => m.key === k)).map(k => ({ key: k, icon: '📌' }));
      list.push(...extra);

      container.innerHTML = list.length ? list.map((g2) => `
        <div class="bk-group reveal">
          <div class="head" data-fold>
            <span class="ico">${g2.icon}</span>
            <h2>${g2.key}</h2>
            <span class="count">${g[g2.key].length}</span>
            <span class="chev">▼</span>
          </div>
          <div class="bk-fold"><div>
            <div class="bk-links">
              ${g[g2.key].map(b => `<a href="${b.url}" target="_blank" rel="noopener" title="${b.url}"><img class="fav" src="${favIcon(b.url)}" alt="" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK_FAV"><span class="name">${b.name}</span><span class="go">↗</span></a>`).join('')}
            </div>
          </div></div>
        </div>
      `).join('') : '<p class="bk-empty">没有匹配的书签，换个关键词试试～</p>';

      // 分组折叠
      container.querySelectorAll('[data-fold]').forEach(h => {
        h.addEventListener('click', () => h.closest('.bk-group').classList.toggle('folded'));
      });
      bindReveal();
    };

    render();
    searchEl.addEventListener('input', () => render());

    // 页头/搜索卡的入场动画
    const ioTop = new IntersectionObserver((es) => {
      es.forEach((e, i) => {
        if (e.isIntersecting) {
          e.target.style.transitionDelay = (i * 100) + 'ms';
          e.target.classList.add('visible');
          ioTop.unobserve(e.target);
        }
      });
    }, { threshold: .1 });
    document.querySelectorAll('main > .reveal').forEach((el) => ioTop.observe(el));
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
  <script src="js/scrollfx.js" defer></script>
  <script src="js/theme-switcher.js" defer></script>
</body>
