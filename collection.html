    .container { max-width: 960px; margin: 0 auto; padding: 48px 24px 60px; }

    /* Hero 区 */
    .cl-hero { text-align: center; padding: 7vh 0 5vh; }
    .cl-kicker { display: flex; align-items: center; justify-content: center; gap: .9rem; margin-bottom: 1rem; }
    .cl-kicker .rule { width: 34px; height: 1px; background: var(--accent); }
    .cl-kicker { font-family: var(--font-mono, monospace); font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .cl-meta { display: flex; gap: 1.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.4rem; }
    .cl-meta span { font-family: var(--font-mono, monospace); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .cl-hero h1 {
      font-size: clamp(3rem, 10vw, 7rem); font-weight: 800;
      letter-spacing: -.04em; line-height: .95; margin-bottom: 1rem;
    }
    .cl-hero h1 .char {
      display: inline-block; opacity: 0; transform: translateY(60%);
      transition: opacity .8s cubic-bezier(.22,.8,.36,1), transform .8s cubic-bezier(.22,.8,.36,1);
      cursor: default;
    }
    .cl-hero h1 .char.show {
      opacity: 1; transform: translateY(0);
      background: linear-gradient(120deg, var(--accent-ink) 10%, var(--accent) 50%, var(--accent-2) 90%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .cl-hero h1 .char.show:hover {
      background: none; -webkit-background-clip: unset; background-clip: unset;
      color: var(--accent-ink);
    }
    .cl-hero p { color: var(--muted); font-size: .9rem; letter-spacing: .05em; margin-top: .6rem; }

    /* 链式入场 */
    /* 性能与可靠修复: 移除链式入场透明门控（IO 漏触发导致整页空白），卡片默认可见 */

    /* 横向滚动横带（页面滚动联动横移，链式互动） */
    .band-section { margin-top: 3rem; }
    .band-head { margin-bottom: 1rem; }
    .band-kicker { font-family: var(--font-mono, monospace); font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    .band-clip { overflow: hidden; margin: 0 -16px; }
    .horizontal-band { display: flex; gap: 1.4rem; padding: .4rem 16px; will-change: transform; }
    .band-item { flex-shrink: 0; width: min(560px, 78vw); margin: 0; position: relative; }
    .band-item img { width: 100%; height: 300px; object-fit: cover; display: block; border-radius: 12px; filter: grayscale(18%); transition: filter .35s, transform .4s cubic-bezier(.22,.8,.36,1); }
    .band-item:hover img { filter: grayscale(0%); transform: scale(1.02); }
    .band-cap { display: flex; justify-content: space-between; align-items: baseline; margin-top: .5rem; }
    .band-no { font-family: var(--font-mono, monospace); font-size: .6rem; letter-spacing: .18em; color: var(--accent); }
    .band-name { font-size: .8rem; color: var(--text); }
.band-name i:empty { display:none; }
.band-name i { font-style: normal; font-family: var(--font-mono, monospace); font-size: .58rem; letter-spacing: .06em; color: var(--muted); margin-left: .5rem; }

    /* 瀑布流 */
    .cl-gallery { columns: 2; column-gap: 16px; margin-top: 2rem; }
    .cl-card {
      break-inside: avoid; margin-bottom: 16px;
      border-radius: 12px; overflow: hidden; position: relative;
      background: var(--card); border: 1px solid var(--line);
      cursor: crosshair;
    }
    .cl-card img {
      width: 100%; height: auto; display: block;
      filter: grayscale(20%); transition: filter .3s, transform .4s cubic-bezier(.22,.8,.36,1);
    }
    .cl-card:hover img { filter: grayscale(0%); transform: scale(1.03); }
    .cl-card .cl-cap b { display:block; font-size:.86rem; font-weight:700; color:#fff; }
.cl-card .cl-cap i:empty { display:none; }
.cl-card .cl-cap i { display:block; font-style:normal; font-family:var(--font-mono,monospace); font-size:.58rem; letter-spacing:.08em; opacity:.75; margin-top:2px; }
.cl-card .cl-cap {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 2rem 1.2rem 1rem;
      background: linear-gradient(transparent, rgba(0,0,0,.55));
      color: #fff; font-size: .85rem; font-weight: 500;
      opacity: 0; transform: translateY(10px);
      transition: transform .3s cubic-bezier(.22,.8,.36,1), box-shadow .3s ease, border-color .3s ease;
    }
    .cl-card:hover .cl-cap { opacity: 1; transform: translateY(0); }
    .cl-card .cl-num {
      position: absolute; top: 10px; right: 10px;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: .7rem;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.6);
      transition: transform .25s cubic-bezier(.22,.8,.36,1), box-shadow .25s ease;
    }
    .cl-card:hover .cl-num { opacity: 1; transform: scale(1); }

    /* 引言 */
    .cl-quote {
      text-align: center; padding: 5rem 1rem;
      border-top: 1px solid var(--line); margin-top: 2rem;
    }
    .cl-quote blockquote {
      font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 500;
      line-height: 1.4; max-width: 600px; margin: 0 auto;
    }
    .cl-quote .word {
      display: inline-block; opacity: 0; transform: translateY(30px);
      transition: transform .6s cubic-bezier(.22,.8,.36,1), opacity .6s ease;
    }
    .cl-quote .word.show { opacity: 1; transform: translateY(0); }
    .cl-quote cite { display: block; margin-top: 1.5rem; color: var(--muted); font-size: .8rem; }

    /* 速度条 */
    .cl-vel { position: fixed; left: 0; top: 0; bottom: 0; width: 3px; z-index: 50; background: var(--line); }
    .cl-vel-fill { width: 100%; height: 0; background: var(--accent); transition: height .08s; }

    /* 进度条 */
    .cl-prog { position: fixed; top: 0; left: 0; height: 2px; z-index: 51; width: 0; background: var(--accent); transition: width .08s; }

    @media (max-width: 640px) {
      .container { padding: 24px 14px 40px; }
      .cl-hero { padding: 6vh 0 4vh; }
      .cl-hero h1 { font-size: clamp(2.2rem, 12vw, 4rem); }
      .cl-gallery { columns: 1; }
      .cl-card { border-radius: 10px; margin-bottom: 12px; }
      .cl-card .cl-cap b { display:block; font-size:.86rem; font-weight:700; color:#fff; }
.cl-card .cl-cap i:empty { display:none; }
.cl-card .cl-cap i { display:block; font-style:normal; font-family:var(--font-mono,monospace); font-size:.58rem; letter-spacing:.08em; opacity:.75; margin-top:2px; }
.cl-card .cl-cap { font-size: .75rem; padding: 1.2rem .8rem .6rem; }
      .cl-card .cl-num { width: 22px; height: 22px; font-size: .6rem; top: 6px; right: 6px; }
      .cl-vel { display: none; }
      .cl-quote { padding: 3rem .5rem; }
      .cl-quote blockquote { font-size: 1.1rem; }
      nav .menu { overflow-x: auto; flex-wrap: nowrap; gap: 4px; padding-bottom: 4px; }
      nav .menu a { white-space: nowrap; font-size: .82rem; }
    }
  </style>

  <script src="js/scrollfx.js" defer></script>
  <script src="js/theme-switcher.js" defer></script>
  <script>
    (function(){
      /* 速度条 */
      var lastY=0, vel=document.getElementById('clVel');
      window.addEventListener('scroll',function(){
        var v=Math.abs(window.scrollY-lastY); lastY=window.scrollY;
        vel.style.height=Math.min(v*3,100)+'%';
        setTimeout(function(){vel.style.height='0%';},120);
      },{passive:true});

      /* 进度条 */
      var prog=document.getElementById('clProg');
      window.addEventListener('scroll',function(){
        var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight;
        prog.style.width=(s/d*100)+'%';
      },{passive:true});

      /* Hero 逐字 */
      var t=document.getElementById('clTitle');
      var sub=t.nextElementSibling;
      var txt=t.textContent;t.innerHTML='';
      for(var i=0;i<txt.length;i++){
        var s=document.createElement('span');s.className='char';s.textContent=txt[i];
        s.style.transitionDelay=(.3+i*.07)+'s';t.appendChild(s);
      }
      /* 副标题延迟 */
      if(sub)sub.style.opacity='0';
      setTimeout(function(){
        t.querySelectorAll('.char').forEach(function(c){c.classList.add('show');});
        if(sub){
          setTimeout(function(){sub.style.transition='opacity .8s';sub.style.opacity='1';},600);
        }
      },100);

      /* 横带滚动联动：按区块经过视口的进度横向平移（链式互动） */
      var band=document.getElementById('clBand'), bandSec=document.getElementById('bandSection');
      function bandTick(){
        if(!band||!bandSec) return;
        var r=bandSec.getBoundingClientRect();
        var total=band.scrollWidth-band.parentElement.clientWidth;
        if(total>0){
          var p=Math.min(Math.max((innerHeight-r.top)/(innerHeight+r.height),0),1);
          band.style.transform='translateX('+(-p*total)+'px)';
        }
      }
      window.addEventListener('scroll',bandTick,{passive:true});
      window.addEventListener('resize',bandTick,{passive:true});
      bandTick();

      /* 引言逐词 */
      var q=document.getElementById('clQuote'),qw=q.textContent.trim().split(/\s+/);
      q.innerHTML='';
      qw.forEach(function(w,i){
        var s=document.createElement('span');s.className='word';s.textContent=w;
        s.style.transitionDelay=(i*.06)+'s';q.appendChild(s);
        q.appendChild(document.createTextNode(' '));
      });
      var qo=new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting)e.target.querySelectorAll('.word').forEach(function(w){w.classList.add('show');});
        });
      },{threshold:.3});
      qo.observe(q);
    })();
  </script>

</body>
</html>
