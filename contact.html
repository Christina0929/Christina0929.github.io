  <title>联系我 · 晴天小站</title>
  <link rel="icon" href="sun-avatar-sm.png" type="image/png">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* 主体 */
    .container { max-width: 860px; margin: 0 auto; padding: 36px 20px 50px; }

    /* 页头横幅 */
    .page-head {
      border-radius: 24px;
      padding: 38px 34px 30px;
      background:
        radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 45%),
        var(--panel-bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
    }
    .crumbs {
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .crumbs a { color: var(--muted); transition: color .2s; }
    .crumbs a:hover { color: var(--accent-ink); }
    .crumbs .sep { margin: 0 8px; color: var(--line-strong); }
    .crumbs .cur { color: var(--text); font-weight: 600; }
    .page-head h1 {
      font-size: clamp(1.7rem, 4.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: .02em;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .page-head h1 .en {
      font-family: var(--font-en);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .page-head .sub {
      font-family: var(--font-hand);
      font-size: .95rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-top: 6px;
    }

    /* 双栏布局 */
    .contact-grid {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* 左栏：直接找我 */
    .side-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      transition: box-shadow .3s;
    }
    .side-card:hover { box-shadow: var(--shadow-md); }
    .side-card h2 {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .side-card h2 .ico {
      width: 32px; height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), color-mix(in srgb, var(--accent-2) 15%, transparent));
      color: var(--accent-ink);
      flex-shrink: 0;
    }
    .side-card .sub {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 16px;
      padding-left: 42px;
    }

    /* 邮箱卡（一键复制） */
    .mail-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      border: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .mail-box .addr {
      flex: 1;
      min-width: 0;
      font-family: var(--font-en);
      font-size: .82rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mail-box button {
      flex-shrink: 0;
      border: none;
      border-radius: 999px;
      padding: 6px 13px;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-ink));
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .mail-box button:hover { transform: translateY(-1px); box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 30%, transparent); }
    .mail-box button.copied { background: linear-gradient(135deg, var(--accent-2), var(--accent-ink)); }

    /* 渠道列表 */
    .channel-list { display: flex; flex-direction: column; gap: 8px; }
    .channel-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 500;
      transition: color .2s, background .2s, border-color .2s, transform .2s, box-shadow .2s;
    }
    .channel-list a:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 5%, var(--card));
      border-color: var(--line);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .channel-list .ico {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--accent-2) 14%, transparent));
      color: var(--accent-ink);
      flex-shrink: 0;
    }
    .channel-list .c-name { flex: 1; min-width: 0; }
    .channel-list .c-desc { font-size: .76rem; color: var(--muted); }
    .channel-list .arrow { color: var(--muted); font-size: .85rem; transition: transform .2s, color .2s; }
    .channel-list a:hover .arrow { color: var(--accent-ink); transform: translate(2px, -2px); }

    /* 右栏：留言表单 */
    .form-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 28px;
      transition: box-shadow .3s;
    }
    .form-card:hover { box-shadow: var(--shadow-md); }
    .form-card .f-head { margin-bottom: 20px; }
    .form-card .f-head h2 {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .form-card .f-head h2 .ico {
      width: 32px; height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), color-mix(in srgb, var(--accent-2) 15%, transparent));
      color: var(--accent-ink);
      flex-shrink: 0;
    }
    .form-card .f-head p { font-size: .82rem; color: var(--muted); padding-left: 42px; }

    .form-card form { display: flex; flex-direction: column; gap: 16px; }
    .field label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
      letter-spacing: .04em;
    }
    .field label .req { color: var(--accent); margin-left: 2px; }
    .field input, .field textarea {
      width: 100%;
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--text);
      font-size: .92rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
    .field input:focus, .field textarea:focus {
      background: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
    }
    .field textarea { min-height: 130px; resize: vertical; line-height: 1.7; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .form-card button[type="submit"] {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-ink));
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      font-size: .92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 32%, transparent);
      transition: transform .2s, box-shadow .2s;
    }
    .form-card button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 7px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
    .form-card button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .form-card button[type="submit"] .arr { transition: transform .2s; }
    .form-card button[type="submit"]:hover .arr { transform: translateX(3px); }
    .form-msg {
      margin-top: 4px;
      font-size: .86rem;
      color: var(--accent-ink);
      font-weight: 500;
      min-height: 1.2em;
    }

    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s cubic-bezier(.22,.8,.36,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    @media (max-width: 820px) {
      .contact-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .container { padding: 24px 14px 40px; }
      .page-head { padding: 28px 20px 24px; border-radius: 18px; }
      .form-card { padding: 20px; border-radius: 16px; }
      .side-card { padding: 20px; border-radius: 16px; }
      .field-row { grid-template-columns: 1fr; }
      .form-card button[type="submit"] { align-self: stretch; justify-content: center; }
    }
  </style>
</head>

  <script>
    // 滚动显示动画（交错）
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          e.target.style.transitionDelay = (i * 100) + 'ms';
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 一键复制邮箱
    const copyBtn = document.getElementById('copy-mail');
    copyBtn.addEventListener('click', async () => {
      const addr = document.getElementById('mail-addr').textContent;
      try {
        await navigator.clipboard.writeText(addr);
      } catch (e) {
        // 兼容不支持 clipboard API 的环境
        const ta = document.createElement('textarea');
        ta.value = addr;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtn.textContent = '已复制 ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('copied'); }, 1800);
    });

    // 联系表单
    const form = document.getElementById('contact-form');
    const msg = document.getElementById('form-msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '发送中…';
      try {
        const res = await fetch('https://formspree.io/f/xrpzgzao', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: new FormData(form)
        });
        if (res.ok) {
          msg.textContent = '发送成功！我会尽快回复你～';
          form.reset();
        } else {
          msg.textContent = '发送失败，请稍后再试。';
        }
      } catch (err) {
        msg.textContent = '网络错误，请稍后再试。';
      }
      btn.disabled = false;
      btn.innerHTML = '发送留言 <span class="arr">→</span>';
    });
  </script>
