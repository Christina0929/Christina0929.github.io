<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="sun-avatar-sm.png">
  <title>晴天小站</title>
  <style>
    :root {
      /* 暖纸·晴天 */
      --accent: #5d7a4e;
      --accent-ink: #46643a;
      --bg: #f2eee4;
      --card: #fffdf7;
      --line: rgba(58, 50, 42, .13);
      --line-strong: rgba(58, 50, 42, .34);
      --text: #35302a;
      --muted: rgba(53, 48, 42, .6);
      --shadow: rgba(58, 50, 42, .08);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* 顶部导航（四页统一） */
    nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    nav .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-size: 1.12rem; font-weight: 800; letter-spacing: .02em; }
    nav .logo span { color: var(--accent-ink); }
    nav .right { display: flex; align-items: center; gap: 12px; }
    nav .menu { display: flex; gap: 2px; }
    nav .menu a {
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .93rem;
      transition: color .2s, background .2s;
    }
    nav .menu a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    nav .menu a.active {
      color: #fff;
      font-weight: 600;
      background: var(--accent-ink);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-ink) 30%, transparent);
    }

    /* 极简个人主页主体（pseudoyu 式居中） */
    .landing {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 24px 40px;
    }

    /* 头像 + 名字 + 标语 */
    .intro {
      text-align: center;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--line);
    }
    .intro .ava {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--line-strong);
      animation: ava-glow 3.2s ease-in-out infinite;
    }
    .intro .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes ava-glow {
      0%, 100% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 12px color-mix(in srgb, var(--accent) 20%, transparent);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
        transform: translateY(-3px);
      }
    }
    .intro h1 {
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -.01em;
      margin-bottom: 10px;
    }
    .intro h1 .brand { color: var(--accent-ink); }
    .intro .tagline {
      font-size: 1.05rem;
      color: var(--muted);
      letter-spacing: .06em;
    }

    /* 关于我（正文留空待站长手打） */
    .about {
      padding: 36px 0 44px;
      border-bottom: 1px solid var(--line);
    }
    .about h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-ink);
      margin-bottom: 16px;
    }
    .about-body { min-height: 60px; }
    .about-body p { color: var(--text); margin-bottom: 14px; }
    .about-body p:last-child { margin-bottom: 0; }
    .about-body .muted { color: var(--muted); }

    /* 站点信息：建站时长 / 博客数量 / 最近更新 */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 30px 0 8px;
    }
    .stat { text-align: center; padding: 6px 8px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat .num {
      display: block;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .stat .label {
      display: block;
      font-size: .76rem;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: .14em;
    }

    /* 账号链接 */
    .links {
      padding: 36px 0 44px;
      border-bottom: 1px solid var(--line);
    }
    .links h2 {
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
    }
    .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .link-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--card);
      font-size: .92rem;
      font-weight: 600;
      transition: border-color .2s, transform .2s, box-shadow .2s, color .2s;
    }
    .link-card:hover {
      border-color: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--shadow);
    }
    .link-card .ico {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      font-weight: 800;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent-ink);
      flex-shrink: 0;
    }
    .link-card .arrow { color: var(--muted); font-size: .85rem; transition: color .2s, transform .2s; }
    .link-card:hover .arrow { color: var(--accent-ink); transform: translate(2px, -2px); }

    /* 回到顶部 */
    .to-top {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 1.05rem;
      box-shadow: 0 4px 14px var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 90;
    }
    .to-top.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .to-top:hover { border-color: var(--accent); color: var(--accent-ink); }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    footer {
      text-align: center;
      padding: 40px 24px 48px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    footer .brand { color: var(--accent-ink); }

    @media (max-width: 640px) {
      nav .menu a { padding: 7px 8px; font-size: .88rem; }
      .landing { padding: 48px 18px 30px; }
      .link-card { padding: 9px 14px; font-size: .88rem; }
    }
  </style>
</head>
<body>

      <div class="right">

  <!-- 回到顶部 -->

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    // 滚动显示动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: .12 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // 回到顶部
    const toTop = document.getElementById('to-top');
    window.addEventListener('scroll', () => {
      toTop.classList.toggle('show', window.scrollY > 400);
    });
    toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 动态年份
    document.getElementById('year').textContent = new Date().getFullYear();

    // 建站计时器（2026-08-05 09:00:00 起，每秒跳动）
    const birth = new Date(2026, 7, 5, 9, 0, 0);
    const uptimeEl = document.getElementById('uptime');
    const pad = (n) => String(n).padStart(2, '0');
    function tickUptime() {
      let s = Math.max(0, Math.floor((Date.now() - birth.getTime()) / 1000));
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60);
      uptimeEl.textContent = d + ' 天 ' + pad(h) + ':' + pad(m) + ':' + pad(s % 60);
    }
    tickUptime();
    setInterval(tickUptime, 1000);

    // 博客数量 + 最近更新（从 blog.html 的文章数据动态读取，失败时兜底）
    fetch('blog.html')
      .then((r) => r.text())
      .then((html) => {
        const dates = [...html.matchAll(/date:\s*'([^']+)'/g)].map((m) => m[1]);
        if (!dates.length) throw new Error('no posts');
        document.getElementById('post-count').textContent = dates.length + ' 篇';
        document.getElementById('last-update').textContent = dates.sort().pop();
      })
      .catch(() => {
        document.getElementById('post-count').textContent = '3 篇';
        document.getElementById('last-update').textContent = '2026年8月5日';
      });
  </script>
  <!-- Live2D 看板娘 -->

</body>
</html>
