<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{var t=localStorage.getItem("site-theme")||((document.cookie.match(/(?:^|; )site-theme=([^;]*)/))||[])[1]||"";if(t)document.documentElement.setAttribute("data-theme",decodeURIComponent(t))}catch(e){}</script>
  <title>开站大吉 '◡' · 晴天小站</title>
  <link rel="icon" href="sun-avatar-sm.png" type="image/png">
  <link rel="stylesheet" href="css/theme.css?v=3">
  <link rel="stylesheet" href="css/music-player.css?v=3">
  <style data-page-css>

    .container { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 26px;
      align-items: start;
    }
    .l-main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

    /* 文章头：居中竖排（标题为主角，头像作落款） */
    .post-head {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .post-head-main { min-width: 0; }
    .post-ava {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--line-strong);
      /* 静态化: 无限光晕动画移除 */
      order: -1;
    }
    .post-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .post-tag {
      display: inline-block;
      font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
      font-size: .68rem;
      letter-spacing: .14em;
      color: var(--accent-ink);
      border: none;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 999px;
      padding: 3px 14px;
      margin-bottom: 14px;
    }
    .post-head h1 {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      font-weight: 900;
      letter-spacing: .01em;
      line-height: 1.28;
      margin-bottom: 10px;
    }
    .post-meta { font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace); color: var(--muted); font-size: .7rem; letter-spacing: .1em; }
    .post-meta .sep { margin: 0 8px; color: var(--line-strong); }

    .post-body {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      line-height: 2;
    }
    .post-body p { margin-bottom: 18px; }
    .post-body > p:first-of-type { font-size: 1.08rem; color: var(--text); }
    .post-body strong { color: var(--text); font-weight: 600; }
    .post-body a { color: var(--accent-ink); border-bottom: 1px solid var(--line-strong); }
    .post-body a:hover { border-bottom-color: var(--accent-ink); }

    /* 继续阅读：编辑式行 */
    .other { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); max-width: 700px; margin-left: auto; margin-right: auto; }
    .other-title { font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace); font-size: .66rem; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .other-list { display: flex; flex-direction: column; }
    .other-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background .18s, padding-left .2s;
    }
    .other-item:last-child { border-bottom: none; }
    .other-item:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); padding-left: 14px; }
    .other-item .o-name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; flex: 1; }
    .other-item .o-date { font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace); font-size: .66rem; color: var(--muted); flex-shrink: 0; letter-spacing: .1em; }
    .other-item .o-arrow { color: var(--muted); flex-shrink: 0; transition: color .2s; }
    .other-item:hover .o-arrow { color: var(--accent-ink); }

    /* 上一篇 / 下一篇（3D 翻书翻面） */
    .post-nav {
      margin-top: 44px;
      padding-top: 24px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: .9rem;
      perspective: 1200px; /* 景深：让翻转有立体书页感 */
    }
    .post-nav a {
      position: relative;
      display: block;
      width: 148px;
      height: 52px;
      color: var(--accent-ink);
      font-weight: 600;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.25,.6,.3,1);
    }
    .post-nav a .pg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 1px 4px var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      white-space: nowrap;
      font-size: .9rem;
    }
    .post-nav a .pg-front { color: var(--accent-ink); }
    .post-nav a .pg-back {
      transform: rotateY(180deg);
      color: var(--muted);
      font-size: .82rem;
      border-color: var(--line-strong);
      background: color-mix(in srgb, var(--card) 88%, var(--bg));
    }
    /* 翻书：悬停停留后整页翻过去，露出背面目标文章（JS 控制 .flip，防快速划动连转） */
    .post-nav a.flip { transform: rotateY(180deg); text-decoration: none; }
    /* 只有单个翻页按钮时（如"正在开发"置底、仅保留下一篇）靠右显示 */
    .post-nav a:only-child { margin-left: auto; }
    .post-nav .prev { color: var(--muted); font-weight: 400; }
    .post-nav .prev .pg-front { color: var(--muted); }
    .post-nav .prev:hover .pg-front { color: var(--text); }

    /* 侧栏作者卡 */
    .side-author { text-align: center; }
    .side-author .ava {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      border: 1px solid var(--line-strong);
    }
    .side-author h3 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
    .side-author p { color: var(--muted); font-size: .82rem; line-height: 1.7; }


    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .l-side { position: static; }
    }
    @media (max-width: 640px) {
      .container { padding: 18px 14px 50px; }
      .card { padding: 22px; }
      .post-head { gap: 14px; }
      .post-ava { width: 56px; height: 56px; }
    }

  </style>
</head>

  <script src="js/common.js?v=3"></script>
  <script>
    // 上一篇/下一篇翻书：短停留才翻面，防快速划过时连续翻转
    document.querySelectorAll('.post-nav a').forEach((a) => {
      let t = null;
      a.addEventListener('mouseenter', () => {
        clearTimeout(t);
        t = setTimeout(() => a.classList.add('flip'), 120);
      });
      a.addEventListener('mouseleave', () => {
        clearTimeout(t);
        a.classList.remove('flip');
      });
    });
  </script>
