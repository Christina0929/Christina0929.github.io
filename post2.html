<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页便笺 · 晴天小站</title>
  <style>
    :root {
      --accent: #5d7a4e;
      --accent-ink: #46643a;
      --bg: #f2eee4;
      --card: #fffdf7;
      --line: rgba(58, 50, 42, .13);
      --line-strong: rgba(58, 50, 42, .34);
      --text: #35302a;
      --muted: rgba(53, 48, 42, .6);
      --shadow: rgba(58, 50, 42, .08);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      transition: background .35s, color .35s;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    nav .inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
      height: 62px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-size: 1.12rem; font-weight: 800; letter-spacing: .02em; }
    nav .logo span { color: var(--accent-ink); }
    nav .right { display: flex; align-items: center; gap: 12px; }
    nav .menu { display: flex; gap: 2px; }
    nav .menu a {
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .93rem;
      transition: color .2s, background .2s;
    }
    nav .menu a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    nav .menu a.active {
      color: #fff;
      font-weight: 600;
      background: var(--accent-ink);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-ink) 30%, transparent);
    }

    .container { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 26px;
      align-items: start;
    }
    .l-main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .l-side { display: flex; flex-direction: column; gap: 24px; position: sticky; top: 84px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .sec-title { font-size: 1.08rem; font-weight: 800; margin-bottom: 20px; }
    .sec-title small { font-size: .8rem; font-weight: 400; color: var(--muted); }

    /* 面包屑：首页 / 博客 / 文章标题 */
    .crumbs {
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .crumbs a { color: var(--muted); transition: color .2s; }
    .crumbs a:hover { color: var(--accent-ink); }
    .crumbs .sep { margin: 0 8px; color: var(--line-strong); }
    .crumbs .cur { color: var(--text); font-weight: 600; }

    .post-tag {
      display: inline-block;
      font-size: .74rem;
      letter-spacing: .06em;
      color: var(--accent-ink);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 3px 13px;
      margin-bottom: 18px;
    }
    .post-head h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .post-meta { color: var(--muted); font-size: .86rem; }
    .post-meta .sep { margin: 0 8px; color: var(--line-strong); }

    .post-body { font-size: 1rem; color: var(--muted); margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line); }
    .post-body p { margin-bottom: 18px; }

    /* 书签网格 */
    .bm-section { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line); }
    .bm-title { font-size: 1rem; font-weight: 800; margin-bottom: 18px; }
    .bm-title small { font-size: .8rem; font-weight: 400; color: var(--muted); margin-left: 8px; }
    .bm-groups {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .bm-group {
      background: color-mix(in srgb, var(--card) 60%, var(--bg));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .bm-group .bm-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .bm-ico { font-size: .95rem; flex-shrink: 0; }
    .bm-group h3 { font-size: .95rem; font-weight: 700; flex: 1; min-width: 0; }
    .bm-group .count {
      font-size: .68rem;
      letter-spacing: .05em;
      color: var(--accent-ink);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0 8px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .bm-group ul { list-style: none; display: flex; flex-direction: column; }
    .bm-group li { margin: 0; }
    .bm-group a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      color: var(--muted);
      font-size: .85rem;
      border-radius: 7px;
      transition: color .15s, background .15s;
    }
    .bm-group a:hover { color: var(--text); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .bm-group .bm-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .bm-group .tag-src {
      flex-shrink: 0;
      font-size: .58rem;
      letter-spacing: .04em;
      color: var(--muted);
      opacity: .55;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }
    .bm-group a:hover .tag-src { opacity: 1; color: var(--accent-ink); }

    .other { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--line); }
    .other-title { font-size: 1rem; font-weight: 800; margin-bottom: 14px; }
    .other-list { display: flex; flex-direction: column; }
    .other-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background .18s, padding-left .2s;
    }
    .other-item:last-child { border-bottom: none; }
    .other-item:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); padding-left: 14px; }
    .other-item .o-name { font-size: .95rem; font-weight: 600; flex: 1; }
    .other-item .o-date { font-size: .78rem; color: var(--muted); flex-shrink: 0; }
    .other-item .o-arrow { color: var(--muted); flex-shrink: 0; transition: color .2s; }
    .other-item:hover .o-arrow { color: var(--accent-ink); }

    .post-nav {
      margin-top: 40px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .9rem;
    }
    .post-nav a { color: var(--accent-ink); font-weight: 600; }
    .post-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .post-nav .prev { color: var(--muted); font-weight: 400; }
    .post-nav .prev:hover { color: var(--text); }

    .side-author { text-align: center; }
    .side-author .ava {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      border: 1px solid var(--line-strong);
    }
    .side-author h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
    .side-author p { color: var(--muted); font-size: .82rem; line-height: 1.7; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    footer {
      text-align: center;
      padding: 40px 24px 48px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    footer .heart { color: var(--accent); }
    footer .brand { color: var(--accent-ink); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .l-side { position: static; }
    }
    @media (max-width: 760px) {
      .container { padding: 18px 14px 50px; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <nav>

      <div class="right">

  <div class="container">
    <div class="layout">

          <section class="other">

      </aside>

  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 分组顺序与图标
    const GROUP_META = [
      { key: '我的网站', icon: '🏠' },
      { key: 'AI 工具', icon: '🤖' },
      { key: '编程开发', icon: '💻' },
      { key: '学术论文', icon: '📚' },
      { key: '娱乐', icon: '🎮' },
      { key: '推荐工具', icon: '🧰' }
    ];

    // 便签书签（数据源：bookmarks.json，已按本地最新删减更新）
    const ALL_BOOKMARKS = [

      { folder: 'AI 工具', name: 'Kimi AI 官网', url: 'https://www.kimi.com/zh/'},
      { folder: 'AI 工具', name: 'ChatGPT 中文', url: 'https://chatgpt.com/zh-CN/'},
      { folder: 'AI 工具', name: 'DeepSeek', url: 'https://chat.deepseek.com/'},
      { folder: 'AI 工具', name: 'OpenAI', url: 'https://openai.com/zh-Hans-CN/'},
      { folder: 'AI 工具', name: 'Google AI Studio', url: 'https://aistudio.google.com/prompts/new_chat?model=gemini-3.1-flash-lite-image'},
      { folder: 'AI 工具', name: '即梦 AI', url: 'https://jimeng.jianying.com/ai-tool/personal/MS4wLjABAAAAriIGRFR106rivvySz3mYxKwgSJGtXxS_VCnscjKmCRw'},
      { folder: 'AI 工具', name: 'Suno - AI 音乐', url: 'https://suno.com/create?mode=CUSTOM'},
      { folder: 'AI 工具', name: 'Cursor', url: 'https://cursor.com/dashboard'},
      { folder: 'AI 工具', name: 'OpenCode 中文教程', url: 'https://learnopencode.com/'},
      { folder: 'AI 工具', name: '简介 | OpenCode', url: 'https://opencode.ai/docs'},

      { folder: '编程开发', name: 'GitHub', url: 'https://github.com/'},
      { folder: '编程开发', name: '力扣 LeetCode', url: 'https://leetcode.cn/?lang=zh'},
      { folder: '编程开发', name: 'CSDN', url: 'https://www.csdn.net/'},
      { folder: '编程开发', name: 'Stack Overflow', url: 'https://stackoverflow.com/'},
      { folder: '编程开发', name: '菜鸟教程', url: 'https://www.runoob.com/'},
      { folder: '编程开发', name: '我要自学网', url: 'https://www.51zxw.net/'},
      { folder: '编程开发', name: '学吧导航', url: 'https://www.xue8nav.com/'},
      { folder: '编程开发', name: 'Codecademy', url: 'https://www.codecademy.cn/tutorial/python/'},
      { folder: '编程开发', name: 'Coursera', url: 'https://www.coursera.org/'},
      { folder: '编程开发', name: '良许嵌入式', url: 'https://www.lxlinux.net/e/'},
      { folder: '编程开发', name: 'Code-noob', url: 'https://github.com/yuyedeng0929/code-noob'},
      { folder: '编程开发', name: 'CipherTalk', url: 'https://github.com/ILoveBingLu/CipherTalk'},
      { folder: '编程开发', name: '猪八戒网', url: 'https://www.zbj.com/'},
      { folder: '编程开发', name: '代理客户端协议', url: 'https://agentclientprotocol.com/get-started/introduction'},
      { folder: '编程开发', name: 'Formspree', url: 'https://formspree.io/forms/xrpzgzao/integration'},

      { folder: '学术论文', name: '中国知网', url: 'https://www.cnki.net/'},
      { folder: '学术论文', name: 'Sci-Hub', url: 'https://sci-hub.st/'},
      { folder: '学术论文', name: 'MDPI', url: 'https://www.mdpi.com/'},
      { folder: '学术论文', name: 'OALib', url: 'https://www.oalib.com/'},
      { folder: '学术论文', name: '文献互助平台 - 科研通', url: 'https://www.ablesci.com/'},
      { folder: '学术论文', name: '全国图书馆参考咨询联盟', url: 'http://www.ucdrs.superlib.net/'},
      { folder: '学术论文', name: '国家哲学社会科学文献中心', url: 'https://www.ncpssd.org/'},
      { folder: '学术论文', name: '梅斯AI导航站', url: 'https://aisite.medsci.cn/'},
      { folder: '学术论文', name: '氢离子', url: 'https://www.ali-doctor.com/channel?tab=literature'},
      { folder: '学术论文', name: '知乎', url: 'https://www.zhihu.com/'},

      { folder: '娱乐', name: '哔哩哔哩', url: 'https://www.bilibili.com/'},
      { folder: '娱乐', name: 'AcFun 弹幕视频网', url: 'https://www.acfun.cn/'},
      { folder: '娱乐', name: '萌娘百科', url: 'https://mzh.moegirl.org.cn/Mainpage#/flow'},
      { folder: '娱乐', name: 'MCBBS 中文论坛', url: 'https://www.mcbbs.co/forum.php'},
      { folder: '娱乐', name: 'LittleSkin 皮肤站', url: 'https://littleskin.cn/?lang=zh_CN'},
      { folder: '娱乐', name: 'Amazon Luna', url: 'https://luna.amazon.com/gamenight'},
      
      { folder: '推荐工具', name: 'b站@一只小辉金吖', url: 'https://link3.cc/huijinya520'},
      { folder: '推荐工具', name: 'QQ邮箱', url: 'https://wx.mail.qq.com/home/index?sid=zTE5YoyvMTAuEXFZAFBYTQAA#/list/1/1'},
      { folder: '推荐工具', name: '2925邮箱', url: 'https://www.2925.com/login/'},
      { folder: '推荐工具', name: '测速网 SpeedTest.cn', url: 'https://www.speedtest.cn/'},
      { folder: '推荐工具', name: '中科大测速', url: 'https://test.ustc.edu.cn/'},
      { folder: '推荐工具', name: 'V2EX', url: 'https://www.v2ex.com/'},
      { folder: '推荐工具', name: 'UUUP Tools', url: 'https://uuup.net/tools/'},
      { folder: '推荐工具', name: 'Wallhaven 壁纸', url: 'https://riverlanes.site/wallhaven/'},
      { folder: '推荐工具', name: '极简壁纸', url: 'https://bizhi1.com/item-cat/minimalism' },
      { folder: '推荐工具', name: 'OpenRouter', url: 'https://openrouter.ai/workspaces/default?utm_source=signup-success'}
    ];

    const groups = {};
    ALL_BOOKMARKS.forEach(b => {
      const key = b.folder || '未分类';
      (groups[key] = groups[key] || []).push(b);
    });
    const ordered = [];
    GROUP_META.forEach(m => { if (groups[m.key]) ordered.push(m); });
    const rest = Object.keys(groups).filter(k => !GROUP_META.some(m => m.key === k)).map(k => ({ key: k, icon: '📌' }));
    ordered.push(...rest);

    const container = document.getElementById('bm-groups');
    container.innerHTML = ordered.map(g => `
      <div class="bm-group">
        <div class="bm-head"><span class="bm-ico">${g.icon}</span><h3>${g.key}</h3><span class="count">${groups[g.key].length}</span></div>
        <ul>
          ${groups[g.key].map(b => `<li><a href="${b.url}" target="_blank"><span class="bm-name">${b.name}</span></a></li>`).join('')}
        </ul>
      </div>
    `).join('');
    document.getElementById('bm-total').textContent = `${ALL_BOOKMARKS.length} 个书签`;

    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: .1 });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
  </script>

</body>
