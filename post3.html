<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="sun-avatar-sm.png">
  <title>正在开发 · 晴天小站</title>
  <style>
    :root {
      --accent: #5d7a4e;
      --accent-ink: #46643a;
      --bg: #f2eee4;
      --card: #fffdf7;
      --line: rgba(58, 50, 42, .13);
      --line-strong: rgba(58, 50, 42, .34);
      --text: #35302a;
      --muted: rgba(53, 48, 42, .6);
      --shadow: rgba(58, 50, 42, .08);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      transition: background .35s, color .35s;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* 统一导航（四页一致） */
    nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    nav .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo { font-size: 1.12rem; font-weight: 800; letter-spacing: .02em; }
    nav .logo span { color: var(--accent-ink); }
    nav .right { display: flex; align-items: center; gap: 12px; }
    nav .menu { display: flex; gap: 2px; }
    nav .menu a {
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .93rem;
      transition: color .2s, background .2s;
    }
    nav .menu a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 7%, transparent); }
    nav .menu a.active {
      color: #fff;
      font-weight: 600;
      background: var(--accent-ink);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-ink) 30%, transparent);
    }

    .container { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 26px;
      align-items: start;
    }
    .l-main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .l-side { display: flex; flex-direction: column; gap: 24px; position: sticky; top: 84px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 2px 10px var(--shadow);
    }

    /* 面包屑：首页 / 博客 / 文章标题 */
    .crumbs {
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .crumbs a { color: var(--muted); transition: color .2s; }
    .crumbs a:hover { color: var(--accent-ink); }
    .crumbs .sep { margin: 0 8px; color: var(--line-strong); }
    .crumbs .cur { color: var(--text); font-weight: 600; }

    
    /* 文章头：头像在左，标题在右 */
    .post-head {
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: left;
    }
    .post-head-main { min-width: 0; flex: 1; }
    .post-ava {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1px var(--line-strong);
      animation: ava-glow 3.2s ease-in-out infinite;
    }
    .post-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes ava-glow {
      0%, 100% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 12px color-mix(in srgb, var(--accent) 20%, transparent);
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 0 1px var(--line-strong), 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
        transform: translateY(-3px);
      }
    }
    .post-tag {
      display: inline-block;
      font-size: .74rem;
      letter-spacing: .06em;
      color: var(--accent-ink);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 3px 13px;
      margin-bottom: 16px;
    }
    .post-head h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .post-meta { color: var(--muted); font-size: .86rem; }
    .post-meta .sep { margin: 0 8px; color: var(--line-strong); }

    .post-body { font-size: 1rem; color: var(--muted); margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
    .post-body p { margin-bottom: 18px; }
    .post-body strong { color: var(--text); font-weight: 600; }
    .post-body a { color: var(--accent-ink); border-bottom: 1px solid var(--line-strong); }
    .post-body a:hover { border-bottom-color: var(--accent-ink); }

    /* 继续阅读 */
    .other { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
    .other-title { font-size: 1rem; font-weight: 800; margin-bottom: 12px; }
    .other-list { display: flex; flex-direction: column; }
    .other-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      transition: background .18s, padding-left .2s;
    }
    .other-item:last-child { border-bottom: none; }
    .other-item:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); padding-left: 14px; }
    .other-item .o-name { font-size: .95rem; font-weight: 600; flex: 1; }
    .other-item .o-date { font-size: .78rem; color: var(--muted); flex-shrink: 0; }
    .other-item .o-arrow { color: var(--muted); flex-shrink: 0; transition: color .2s; }
    .other-item:hover .o-arrow { color: var(--accent-ink); }

    /* 上一篇 / 下一篇 */
    .post-nav {
      margin-top: 40px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .9rem;
    }
    .post-nav a { color: var(--accent-ink); font-weight: 600; }
    .post-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .post-nav .prev { color: var(--muted); font-weight: 400; }
    .post-nav .prev:hover { color: var(--text); }

    /* 侧栏作者卡 */
    .side-author { text-align: center; }
    .side-author .ava {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      border: 1px solid var(--line-strong);
    }
    .side-author h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
    .side-author p { color: var(--muted); font-size: .82rem; line-height: 1.7; }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    footer {
      text-align: center;
      padding: 36px 24px 44px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    footer .brand { color: var(--accent-ink); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .l-side { position: static; }
    }
    @media (max-width: 640px) {
      nav .menu a { padding: 7px 8px; font-size: .88rem; }
      .container { padding: 18px 14px 50px; }
      .card { padding: 22px; }
      .post-head { gap: 14px; }
      .post-ava { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="inner">
      <a class="logo" href="index.html"><span>晴天</span>小站</a>
      <div class="right">
        <div class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html" class="active">博客</a>
          <a href="index.html#about">关于我</a>
          <a href="contact.html">联系我</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="layout">
      <div class="l-main">
        <article class="card reveal">
          <nav class="crumbs" aria-label="面包屑">
            <a href="index.html">首页</a><span class="sep">/</span>
            <a href="blog.html">博客</a><span class="sep">/</span>
            <span class="cur">正在开发</span>
          </nav>

          <header class="post-head">
            <div class="post-ava"><img src="sun-avatar.png" alt=""></div>
            <div class="post-head-main">
              <span class="post-tag">最新留言</span>
              <h1>正在开发</h1>
              <p class="post-meta">2026年8月5日 <span class="sep">/</span> 开发中</p>
            </div>
          </header>

          <div class="post-body">
            <p>仍在test中，敬请期待…</p><p>若有任何宝贵意见，欢迎留言联系我:D</p>
          </div>

          <section class="other">
            <h3 class="other-title">继续阅读</h3>
            <div class="other-list">
              <a class="other-item" href="post1.html"><span class="o-name">开站大吉 '◡'</span><span class="o-date">2026年8月5日</span><span class="o-arrow">→</span></a>
              <a class="other-item" href="post2.html"><span class="o-name">网页便笺</span><span class="o-date">2026年8月5日</span><span class="o-arrow">→</span></a>
            </div>
          </section>

          <nav class="post-nav">
            <a class="prev" href="post2.html">← 上一篇</a>
            <a href="post1.html">下一篇 →</a>
          </nav>
        </article>
      </div>

    </div>
  </div>

  <footer>© <span id="year"></span> <span class="brand">晴天</span>小站 · Ciallo～(∠・ω< )⌒☆</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: .1 });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
  </script>
  <!-- Live2D 看板娘 -->
  <script type="module" src="live2d/kandao.js"></script>
</body>
</html>
